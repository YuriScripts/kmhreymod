name: Build Android .so
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Download Dependencies
        run: |
          wget https://github.com/ocornut/imgui/archive/refs/tags/v1.90.1.zip
          unzip v1.90.1.zip
          mv imgui-1.90.1 imgui
          git clone https://github.com/Rprop/And64InlineHook.git
          mv And64InlineHook hook
          cp hook/And64InlineHook.cpp hook/And64InlineHook.hpp 
          
      - name: Fix Dobby Assembly Issue
        run: |
          # Delete the broken Mac assembly file
          rm dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm
          # Enable the C++ fallback in Dobby's source
          sed -i 's/#if 0/#if 1/g' dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.cc

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: kmhrey-menu-lib
          path: build/libkmhrey_menu.so
